<h1>说明：业务降级操作文档</h1>
<div style="none"></div>
<h2 id="section-3">适用情况</h2>
<p>1. 业务方（如tatooine）对某个决策的处理出现问题，希望Zeus暂停该决策的产生。</p>
<p>2.业务方对某个场景的处理出现问题，希望Zeus暂停执行该场景。</p>
<h2 id="section-6">降级作用</h2>
<p>如果场景或决策处于降级状态，那么对应的场景不再执行，对应的决策不再产生</p>
